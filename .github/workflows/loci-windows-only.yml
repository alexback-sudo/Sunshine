---
# Added ONLY in this fork, to build what LizardByte's own CI never built: PR #5460's Windows
# binary. The upstream runs on that PR are all `action_required` — a fork PR whose workflows no
# maintainer ever approved — so there is no artifact to download and this is the substitute.
# It calls upstream's OWN ci-windows.yml unchanged, so the binary is built by their recipe, not
# by one of ours. Unsigned: the Azure signing inputs are optional and deliberately left empty.
name: Windows-only (loci M32 rung 1A)

permissions: {}

# `push` on this branch, not `workflow_dispatch`: dispatching by API requires the workflow to
# exist on the fork's DEFAULT branch, and this fork's default is upstream master, which must stay
# untouched so it keeps merging cleanly. Every upstream workflow here filters `push` to `master`
# (`ci.yml`, `_codeql.yml`, `localize.yml`, `update-pages.yml`), so a push to this branch starts
# exactly this job and nothing else.
on:
  push:
    branches:
      - loci-m32-rung1a
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: '0.0.0'
